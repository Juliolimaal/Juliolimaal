    <text x="600" y="205" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="48" font-weight="700" letter-spacing="3">JULIO CESAR</text>
    <text x="600" y="246" text-anchor="middle" fill="#FF00D4" font-family="monospace" font-size="17" letter-spacing="3">WEB DEVELOPMENT • SOFTWARE • TECHNOLOGY</text>
  </g>

  <g font-family="monospace" font-size="12">
