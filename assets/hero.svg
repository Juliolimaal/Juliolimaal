    <text x="424" y="297" text-anchor="middle" fill="#00F7FF">TYPESCRIPT</text>
    <rect x="505" y="278" width="92" height="28" rx="14" fill="#140A16" stroke="#FF00D4"/>
    <text x="551" y="297" text-anchor="middle" fill="#FF74E7">REACT</text>
    <rect x="614" y="278" width="92" height="28" rx="14" fill="#08120C" stroke="#39FF14"/>
