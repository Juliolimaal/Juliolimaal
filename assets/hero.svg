<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080D"/>
      <stop offset="0.5" stop-color="#0B111A"/>
      <stop offset="1" stop-color="#090712"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F7FF" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#00F7FF"/>
      <stop offset="0.55" stop-color="#FF00D4"/>
      <stop offset="1" stop-color="#FF00D4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#00F7FF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="1197" height="357" rx="22.5" fill="none" stroke="#1F2A37" stroke-width="3"/>

